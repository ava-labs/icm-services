name: Setup reforge
description: Cache and build the reforge binary from icm-macros

runs:
  using: composite
  steps:
    - name: Cache reforge binary
      id: cache-reforge
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/bin/reforge
        key: ${{ runner.os }}-reforge-${{ hashFiles('icm-macros/Cargo.lock', 'icm-macros/Cargo.toml', 'icm-macros/rust-toolchain.toml', 'icm-macros/src/**') }}

    - name: Cache Cargo (icm-macros)
      if: steps.cache-reforge.outputs.cache-hit != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          icm-macros/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('icm-macros/Cargo.lock', 'icm-macros/Cargo.toml', 'icm-macros/rust-toolchain.toml', 'icm-macros/src/**') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Build reforge
      if: steps.cache-reforge.outputs.cache-hit != 'true'
      shell: bash
      run: ./scripts/build_reforge.sh
