# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gomod" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # avalanchego's tmpnet test fixture (through at least v1.15.2) is written
      # against prometheus/client_golang v1.23 and no longer compiles against
      # v1.25.0, which changed the api/prometheus/v1 QueryRange signature.
      # Remove once avalanchego requires client_golang >= v1.25.0.
      - dependency-name: "github.com/prometheus/client_golang"
        versions: [">=1.25.0"]
    groups:
      weekly-ava-updates:
        patterns:
          - "github.com/ava-labs/*"
      weekly-ext-updates:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      weekly-github-actions:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directories:
      - "/icm-macros"
      - "/scripts/tools/zk-proofs-gen"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      weekly-cargo-updates:
        patterns:
          - "*"
    ignore:
      # The SP1-patched bls12_381 used by zk-proofs-gen is built on digest 0.10,
      # so sha2 0.11 (digest 0.11) cannot satisfy its hash-to-curve bounds.
      - dependency-name: "sha2"
        versions: [">=0.11"]
