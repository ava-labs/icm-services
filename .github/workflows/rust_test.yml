name: Rust tests for zk-proofs-gen

on:
  push:
    paths:
      - "scripts/tools/zk-proofs-gen/**"
      - ".github/workflows/rust_test.yml"
  pull_request:
    paths:
      - "scripts/tools/zk-proofs-gen/**"
      - ".github/workflows/rust_test.yml"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/tools/zk-proofs-gen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned nightly
        run: rustup toolchain install $(cat nightly-toolchain) --component rustfmt
      - name: Install taplo and cargo-sort
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: taplo-cli,cargo-sort
      - run: make fmt-check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/tools/zk-proofs-gen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned nightly
        run: rustup toolchain install $(cat nightly-toolchain) --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: scripts/tools/zk-proofs-gen -> target
      # Excluded crates (see Makefile):
      #   zk-valset-program — targets the zkVM, not native
      #   zk-valset-prover  — build.rs requires the SP1 toolchain
      - run: make clippy

  rust-unit-tests:
    name: Rust unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/tools/zk-proofs-gen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: scripts/tools/zk-proofs-gen -> target
          
      - run: cargo test --release -p merkle-sig-verification
