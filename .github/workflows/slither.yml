name: slither Analyze

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

jobs:
  slither-analyze:
    name: Slither Analyze
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Slither
        run: |
          pip install --require-hashes --no-deps -r .github/requirements/slither.txt

      # Foundry is pinned in scripts/install_foundry.sh, so the key changes with the pin.
      - name: Cache Foundry
        id: foundry-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.foundry
          key: foundry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install_foundry.sh') }}

      - name: Install Foundry
        if: steps.foundry-cache.outputs.cache-hit != 'true'
        run: ./scripts/install_foundry.sh

      - name: Apply expanded macros
        run: |
          # Copy pre-generated expanded contracts over the macro-annotated originals
          # so that forge compiles the expanded Solidity that slither will analyze.
          find icm-contracts-expanded -name '*.sol' | while IFS= read -r f; do
              rel="${f#icm-contracts-expanded/}"
              dest="icm-contracts/$rel"
              cp "$f" "$dest"
          done

      - name: Compile with expanded sources
        run: |
          export PATH=$PATH:$HOME/.foundry/bin
          forge build --build-info
          FOUNDRY_PROFILE=common forge build --build-info
          FOUNDRY_PROFILE=ethereum forge build --build-info

      - name: Run Slither
        run: |
          export PATH=$PATH:$HOME/.foundry/bin:$HOME/.local/bin
          slither ./ --foundry-ignore-compile --fail-none --sarif ./results.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
