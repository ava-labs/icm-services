name: slither Analyze

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

jobs:
  slither-analyze:
    name: Slither Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.8

      - name: Install Slither
        run: |
          pip install slither-analyzer

      - name: Install Foundry
        run: ./scripts/install_foundry.sh

      - name: Cache reforge binary
        id: cache-reforge
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/reforge
          key: ${{ runner.os }}-reforge-${{ hashFiles('icm-macros/Cargo.lock') }}

      - name: Cache Cargo (icm-macros)
        if: steps.cache-reforge.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            icm-macros/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('icm-macros/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Configure git credentials for private dependencies
        if: steps.cache-reforge.outputs.cache-hit != 'true'
        run: |
          git config --global url."https://x-access-token:${{ secrets.ORG_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
          mkdir -p ~/.cargo && echo -e '[net]\ngit-fetch-with-cli = true' >> ~/.cargo/config.toml

      - name: Build reforge
        if: steps.cache-reforge.outputs.cache-hit != 'true'
        run: ./scripts/build_reforge.sh

      - name: Run Slither
        run: |
          export PATH=$PATH:$HOME/.foundry/bin:$HOME/.local/bin
          slither ./ --fail-none --sarif ./results.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
