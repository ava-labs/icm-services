name: Linting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

# No job here writes to the repository; they only read the checkout and report results.
permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
          go-version-file: 'go.mod'

    - name: Run Lint
      run: |
        ./scripts/lint.sh --go-lint
        git --no-pager diff -- **.go
        git --no-pager diff --quiet -- **.go

  protobuf-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          submodules: recursive
          persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'

    - name: Ensure protobuf changes are checked in
      run: |
        scripts/protobuf_codegen.sh
        git update-index --really-refresh >> /dev/null
        git diff-index HEAD # to show the differences
        git diff-index --quiet HEAD || (echo 'protobuf generated code changes have not all been checked in' && exit 1)

  solhint:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install solhint
      # Pinned so a newly published solhint release cannot change what CI executes;
      # --ignore-scripts blocks dependency lifecycle scripts on install. This job holds
      # no secrets and its GITHUB_TOKEN is read-only and not persisted (see above), so a
      # compromised solhint can at worst falsify lint results for this run.
      run: |
        npm install -g solhint@6.2.4 --ignore-scripts
        solhint --version

    - name: Run Lint
      run: ./scripts/lint.sh --sol-lint

  format-solidity:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        run: ./scripts/install_foundry.sh
      
      - name: Check Solidity Formatting
        run: |
          export PATH=$PATH:$HOME/.foundry/bin
          ./scripts/lint.sh --sol-format-check
        
  gomod_check:
    name: Check go.mod
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - run: go mod tidy
      - run: git --no-pager diff -- go.mod go.sum  # This prints the diff
      - run: git --no-pager diff --quiet -- go.mod go.sum  # This errors if there is a diff

  abi_binding:
    name: abi_binding
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install Foundry
        run: ./scripts/install_foundry.sh

      - name: Install solc
        run: |
          source ./scripts/versions.sh
          wget https://github.com/ethereum/solidity/releases/download/v$AVALANCHE_SOLIDITY_VERSION/solc-static-linux
          chmod +x solc-static-linux
          sudo mv solc-static-linux /usr/local/bin/solc

      - name: Generate ABI Go bindings
        run: |
          export PATH=$PATH:$HOME/.foundry/bin
          export GOPATH=$HOME/go
          export PATH="$PATH:$GOPATH/bin"
          ./scripts/abi_bindings.sh

      - name: Print diff
        run: git --no-pager diff -- abi-bindings/**.go

      - name: Fail if diff exists
        run: git --no-pager diff --quiet -- abi-bindings/**.go