name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  solidity-unit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        run: ./scripts/install_foundry.sh

      - name: Cache Cargo (icm-macros)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            icm-macros/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('icm-macros/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build reforge
        run: ./scripts/build_reforge.sh

      - name: Run Avalanche unit tests
        run: |
          export PATH=$PATH:$HOME/.foundry/bin:$HOME/.local/bin
          forge test -vvv

      - name: Run Ethereum unit tests
        run: |
          export PATH=$PATH:$HOME/.foundry/bin:$HOME/.local/bin
          FOUNDRY_PROFILE=ethereum forge test -vvv

      - name: Run Common unit tests
        run: |
          export PATH=$PATH:$HOME/.foundry/bin:$HOME/.local/bin
          FOUNDRY_PROFILE=common forge test -vvv

  unit_tests:
    name: Unit tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Run Golang Unit Tests
        run: ./scripts/test.sh
